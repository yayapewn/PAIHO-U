
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>PAIHO-U Digital Design Workspace</title>
    <meta name="description" content="Advanced 3D sneaker material customization platform." />
    
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PAIHO-U Digital Design Workspace" />
    <meta property="og:description" content="Click, design, and experience the future of customization." />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              'swipe-in-left': {
                '0%, 100%': { transform: 'translateX(-10px)' },
                '50%': { transform: 'translateX(10px)' }
              },
              'swipe-in-right': {
                '0%, 100%': { transform: 'translateX(10px)' },
                '50%': { transform: 'translateX(-10px)' }
              }
            },
            animation: {
              'swipe-in-left': 'swipe-in-left 2s ease-in-out infinite',
              'swipe-in-right': 'swipe-in-right 2s ease-in-out infinite'
            },
            colors: {
              primary: '#6366f1',
              secondary: '#f8f9fa',
              accent: '#10b981',
            }
          }
        }
      }
    </script>
    <style>
      body { 
        background-color: #f8f9fa; 
        margin: 0; 
        color: #1a1a1a; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior-y: none; /* 防止手機瀏覽器拉動重新整理 */
        user-select: none; /* 移除全域文字選取，避免出現文字遊標 */
        -webkit-user-select: none;
      }
      input, textarea {
        user-select: text; /* 恢復輸入框的選取功能 */
        -webkit-user-select: text;
      }
      #root { 
        height: 100vh;
        height: 100dvh; 
        width: 100vw; 
        overflow: hidden; 
      }
      /* Hide scrollbars for a cleaner UI */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* 處理 iOS 安全區域 */
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
